<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>ISG Test</title>
    <style>
        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #FF8C00;
            margin-bottom: 16px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .ok {
            color: #10B981;
            font-weight: bold;
            font-size: 1.2em;
        }

        code {
            background: #334155;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>🛡️ ISG Saha Gözlem</h1>
        <p class="ok">✅ Tarayıcı çalışıyor!</p>
        <p>Bu sayfayı görüyorsanız tarayıcınız düzgün çalışıyor demektir.</p>
        <hr style="border-color: rgba(148,163,184,0.15); margin: 20px 0;">
        <p><strong>Uygulamayı başlatmak için:</strong></p>
        <p>1. VS Code terminali açın (<code>Ctrl + `</code>)</p>
        <p>2. Şu komutu çalıştırın:</p>
        <p><code>npm run dev</code></p>
        <p>3. Sonra tarayıcıda <a href="http://localhost:5173" style="color:#FF8C00">http://localhost:5173</a> açın</p>
    </div>
</body>

</html>
